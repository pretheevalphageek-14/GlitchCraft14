html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:270px 1fr;max-width:1100px;margin:0 auto;gap:24px;padding:20px}
nav{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:4px}

nav button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--ink);font:inherit;font-size:14px;padding:7px 10px;cursor:pointer;border-radius:0 6px 6px 0}
nav button:hover{background:var(--accbg)}
nav button.on{border-left-color:var(--acc);background:var(--accbg);font-weight:600}
nav small{color:var(--mute);font-family:"JetBrains Mono",monospace}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;min-width:0}
main h2{margin:0 0 6px;font-size:26px}
main h3{margin:26px 0 8px;font-size:16px}
.lede{color:var(--mute);margin:0 0 4px}
pre{background:var(--code);color:var(--codeink,#d7e3f7);padding:14px 16px;border-radius:8px;overflow-x:auto;font:13.5px/1.55 "JetBrains Mono",monospace;margin:8px 0}
code{font-family:"JetBrains Mono",monospace;font-size:.9em;background:var(--accbg);padding:1px 5px;border-radius:4px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.p{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.p input{width:18px;height:18px;accent-color:var(--acc);flex:none}
.p a{color:var(--ink);text-decoration:none;flex:1;font-weight:600}
.p a:hover{color:var(--acc);text-decoration:underline}
.p span.n{font-family:"JetBrains Mono",monospace;color:var(--mute);font-size:13px;width:44px;flex:none}
.p em{font-style:normal;font-size:12px;font-weight:600}

.hint{font-size:13px;color:var(--mute);margin-top:4px}
.tk{background:var(--accbg);border-radius:8px;padding:10px 14px;margin-top:8px}
.pn{display:flex;justify-content:space-between;margin-top:24px}
.pn button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
.pn button:disabled{opacity:.3;cursor:default}

const KEY="cppmastery";let done={},cur=0;
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const all=[...new Set(T.flatMap(t=>t.p.map(p=>p[0])))];
function prog(){const d=all.filter(n=>done[n]).length;bf.style.width=(all.length?d/all.length*100:0)+"%";pt.textContent=d+" of "+all.length+" problems solved"}
function nav(){nv.innerHTML="";T.forEach((t,i)=>{const b=document.createElement("button");if(i==cur)b.className="on";const d=t.p.filter(p=>done[p[0]]).length;b.innerHTML="<span>"+t.t+"</span>"+(t.p.length?"<small>"+d+"/"+t.p.length+"</small><i class='mb'><b style='width:"+(d/t.p.length*100)+"%'></b></i>":"");b.onclick=()=>{cur=i;location.hash="t"+i;render()};nv.appendChild(b)})}
function render(){const t=T[cur];let h="<h2>"+t.t+"</h2><p class='lede'>"+t.c+"</p>";
if(t.inc)h+="<h3>Include</h3><pre>#include "+t.inc.replace(/&lt;/g,"<").replace(/&gt;/g,">")+"</pre>";
if(t.cs)h+="<h3>Which header for what</h3><div class='tw'><table>"+t.cs.map(r=>"<tr><td><code>"+r[0]+"</code></td><td>"+r[1]+"</td></tr>").join("")+"</table></div>";
h+="<h3>Example</h3><pre id='cd'></pre>";
if(t.k)h+="<h3>Patterns to master</h3><ul>"+t.k.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
if(t.p.length){h+="<h3>LeetCode practice (do in order)</h3>";t.p.forEach(p=>{h+="<div class='p"+(done[p[0]]?" done":"")+"'><input type='checkbox' data-n='"+p[0]+"'"+(done[p[0]]?" checked":"")+" aria-label='Solved "+p[2]+"'><span class='n'>#"+p[0]+"</span><a href='https://leetcode.com/problems/"+p[1]+"/' target='_blank' rel='noopener'>"+p[2]+"</a><em class='"+p[3]+"'>"+p[3]+"</em></div>"});
h+="<div class='tk'>Tip: solve it in C++ first, then redo it without looking after a few days. Aim for 2 to 3 problems per topic before moving on, and revisit the Mediums.</div>"}
if(t.k)h+="<h3>Self-check (+5 XP each)</h3>"+t.k.map((x,i)=>"<div class='p"+(done['k'+cur+'_'+i]?' done':'')+"'><input type='checkbox' data-n='k"+cur+"_"+i+"'"+(done['k'+cur+'_'+i]?' checked':'')+" aria-label='Self-check'><a style='pointer-events:none;font-weight:400'>I can explain: "+x+"</a></div>").join("")+"<div class='tk'>Close the tab and explain each one out loud or write it from memory. Teaching it back is the fastest way to learn.</div>";
h+="<div class='pn'><button id='pv'"+(cur?"":" disabled")+">Previous</button><button id='nx'"+(cur<T.length-1?"":" disabled")+">Next topic</button></div>";
mn.innerHTML=h;document.getElementById("cd").textContent=t.code;
mn.querySelectorAll("input[data-n]").forEach(c=>c.onchange=()=>{done[c.dataset.n]=c.checked;if(!c.checked)delete done[c.dataset.n];save();c.parentNode.classList.toggle("done",c.checked);prog();nav()});
pv.onclick=()=>{cur--;render();window.scrollTo(0,0)};nx.onclick=()=>{cur++;render();window.scrollTo(0,0)};
nav();prog()}
const PM={},HK={},PTS={Easy:10,Medium:20,Hard:40};T.forEach(t=>t.p.forEach(p=>{PM[p[0]]=PTS[p[3]];HK[p[0]]=p[3]}));
const TT=["Newbie","Syntax Cadet","Compiler Whisperer","Pointer Wrangler","STL Sage","Algorithm Knight","C++ Grandmaster"];
const Q=["Small progress every day beats a big push once a month.","You don’t learn C++ by reading it. You learn it by compiling it.","Every compiler error is a free lesson.","Stuck for 30 minutes? Read the hint, then re-solve it tomorrow.","Consistency is the whole game. Do one problem today.","Explain it out loud. If you can teach it, you know it."];
let S={log:{},foc:{},goal:3},LL=0,tm=null,end=0,left=1500;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY+"_s")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY+"_s",JSON.stringify(S))}catch(e){}};
const dk=d=>{d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const act=d=>{const k=dk(d);return (S.log[k]||0)>0||(S.foc[k]||0)>0};
function streak(){const d=new Date();let n=0;if(!act(d))d.setDate(d.getDate()-1);while(act(d)){n++;d.setDate(d.getDate()-1)}return n}
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
function xp(){let x=0;for(const k in done){if(PM[k])x+=PM[k];else if(k[0]=="k")x+=5}return x+sum(S.foc)*2}
let tt=null;function toast(m){ts.textContent=m;ts.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>ts.classList.remove("on"),2200)}
const ts=document.createElement("div");ts.id="ts";document.body.appendChild(ts);
function hud(){const x=xp(),l=Math.floor(Math.sqrt(x/60))+1,lo=60*(l-1)*(l-1),hi=60*l*l,sv_=all.filter(n=>done[n]).length,hd=all.filter(n=>done[n]&&HK[n]=="Hard").length,sk_=streak(),fmv=sum(S.foc),g=S.log[dk()]||0;
lvn.textContent="Lv "+l;lvt.textContent=TT[Math.min(l-1,TT.length-1)];xf.style.width=((x-lo)/(hi-lo)*100)+"%";xt.textContent=x+" XP · "+(hi-x)+" to next level";
sk.textContent=sk_;fm.textContent=fmv;gt.textContent="Today’s goal: "+Math.min(g,S.goal)+"/"+S.goal+" problems"+(g>=S.goal?" ✓":" (tap to change)");gf.style.width=Math.min(100,g/S.goal*100)+"%";
const B=[["🌱","First solve",sv_>=1],["🔟","10 solved",sv_>=10],["🥈","25 solved",sv_>=25],["🏆","50 solved",sv_>=50],["🧗","Solved a Hard",hd>=1],["🎯","Cleared a topic",T.some(t=>t.p.length&&t.p.every(p=>done[p[0]]))],["🔥","3-day streak",sk_>=3],["🌋","7-day streak",sk_>=7],["⏱","2 hours focused",fmv>=120]];
bd.innerHTML=B.map(b=>"<span class='"+(b[2]?"":"off")+"' title='"+b[1]+(b[2]?"":" (locked)")+"'>"+b[0]+"</span>").join("");
if(LL&&l>LL)toast("Level up! You are now "+TT[Math.min(l-1,TT.length-1)]);LL=l}
const _p=prog;prog=function(){_p();pt.textContent+=" · "+Math.round(all.filter(n=>done[n]).length/all.length*100)+"%";hud()};
document.addEventListener("change",e=>{const n=e.target.dataset&&e.target.dataset.n;if(!n)return;if(PM[n]){const k=dk();S.log[k]=Math.max(0,(S.log[k]||0)+(e.target.checked?1:-1));sv();if(e.target.checked)toast("+"+PM[n]+" XP · "+HK[n]+" solved")}else if(e.target.checked)toast("+5 XP · self-check");hud()});
gt.onclick=()=>{S.goal=S.goal%5+1;sv();hud()};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){left=Math.max(0,Math.round((end-Date.now())/1000));clk.textContent=fmt(left);if(!left){clearInterval(tm);tm=null;ps.textContent="Start";const k=dk();S.foc[k]=(S.foc[k]||0)+25;sv();left=1500;clk.textContent="25:00";toast("Focus session done · +50 XP");hud()}}
ps.onclick=()=>{if(tm){clearInterval(tm);tm=null;ps.textContent="Resume"}else{end=Date.now()+left*1000;tm=setInterval(tick,500);ps.textContent="Pause"}};
pr.onclick=()=>{clearInterval(tm);tm=null;left=1500;clk.textContent="25:00";ps.textContent="Start"};
qt.textContent=Q[Math.floor(Date.now()/864e5)%Q.length];
const m=/^#t(\d+)$/.exec(location.hash);if(m&&T[+m[1]])cur=+m[1];
render();
</script></body></html>
